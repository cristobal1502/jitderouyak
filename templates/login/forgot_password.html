<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGR Municipal — Recuperar contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body data-error="{{ error }}">

<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="mark">SGR</span>
      <span class="brand-name">SGR Municipal</span>
    </div>

    <div class="login-heading">
      <h1>Recuperar contraseña</h1>
      <p>Ingresa tu correo institucional y te enviaremos un código de 6 dígitos para restablecer tu contraseña.</p>
    </div>

    <form id="forgotForm" method="post" novalidate>
      {% csrf_token %}
      <div class="field">
        <label for="email">Correo institucional</label>
        <input type="email" name="email" id="email" value="{{ email }}" placeholder="nombre.apellido@municipalidad.cl" autocomplete="email">
      </div>

      <button type="submit" class="btn-primary btn-block">Enviar código</button>
    </form>

    <div class="login-footer">
      <a href="{% url 'login' %}" class="forgot-link">Volver a iniciar sesión</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/static/js/forgot_password.js"></script>
</body>
</html>
